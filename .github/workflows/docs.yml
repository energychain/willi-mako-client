name: Documentation and Package Validation

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - 'schemas/**'
      - 'scripts/**'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Validate npm package contents
        run: npm pack --dry-run
